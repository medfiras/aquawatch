[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "aquawatch"
version = "0.1.0"
description = "Home Assistant integration for French water utilities, inspired by pyeauidf"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9",
    "certifi",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component",
    "aioresponses>=0.7.6",
    "pyyaml>=6.0",
]

[tool.setuptools]
packages = ["custom_components", "custom_components.aquawatch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
